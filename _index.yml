indexpage:
  title: Documentação Keystone
  summary: O Keystone STaaS é uma oferta por assinatura na plataforma NetApp Keystone
    que fornece serviços de storage de arquivos, blocos e objetos por meio de um modelo
    de pagamento conforme o uso.
  keywords: NetApp Keystone, Keystone STaaS, storage as a service, subscription
  lead: O NetApp Keystone é a plataforma de storage como serviço da NetApp. O Keystone
    Storage-as-a-Service (STaaS), uma oferta por assinatura no Keystone, fornece serviços
    de storage de arquivos, blocos e objetos por meio de um modelo de pagamento conforme
    o uso. O Keystone STaaS permite que as organizações consumam storage como despesa
    operacional, em vez de fazer um investimento inicial de capital.
